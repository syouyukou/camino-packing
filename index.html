<body>
<main class="shell">
  <header class="topbar">
    <div class="brand"><div class="brand-icon" aria-hidden="true">🐚</div><div><h1>朝聖者裝備欄</h1><small class="pixel">CAMINO PACKING INVENTORY</small></div></div>
    <div class="stat"><b id="typeCount">43</b><span>種裝備</span></div>
    <div class="stat"><b id="unitCount">54</b><span>件總數</span></div>
    <div class="stat"><b id="readyCount">1</b><span>已準備</span></div>
    <div class="progressbox"><div><div class="progress-label"><span>準備進度</span><b id="readyPct">2%</b></div><div class="bar"><i id="readyBar"></i></div></div><div><div class="progress-label"><span>裝入進度</span><b id="packedPct">0%</b></div><div class="bar packed"><i id="packedBar"></i></div></div></div>
  </header>

  <nav class="tabs" aria-label="頁面切換"><button class="tab active" data-view="gear">🎒 裝備欄</button><button class="tab" data-view="notice">📜 出發注意</button></nav>

  <section id="gearView">
    <div class="workspace">
      <section class="panel">
        <header class="panel-head"><div><h2>待整理</h2><p>勾選代表已備妥；按卡片可看介紹，拖到右側可裝包。</p></div><span class="count-badge" id="leftCount">43</span></header>
        <div class="tools"><input id="search" class="search" type="search" placeholder="搜尋裝備名稱、提醒或備註…" aria-label="搜尋裝備"><select id="statusFilter" class="select" aria-label="狀態篩選"><option value="all">全部狀態</option><option value="unready">尚未準備</option><option value="ready">已準備</option><option value="需採買">需採買</option><option value="待確認">待確認</option></select></div>
        <div class="chips" id="chips" aria-label="類別篩選"></div>
        <div class="list" id="itemList"></div>
        <div class="legend"><span><span class="state ready">已有</span> 已擁有／準備完成</span><span><span class="state buy">需採買</span> 尚未購買</span><span><span class="state check">待確認</span> 需核對數量或規格</span></div>
      </section>

      <aside class="panel pack-panel" id="packDrop">
        <header class="panel-head"><div><h2>行李裝備欄</h2><p>右側只顯示已放進行李的裝備。</p></div><span class="count-badge" id="packCount">0 / 54</span></header>
        <div class="backpack"><div class="pack-summary"><b>🎒 小行李箱／主背包</b><span id="slotSummary">0 / 43 格</span></div><div class="slots" id="slots"></div><p class="drop-note">點「放入行李」，或把左側裝備拖到這裡</p></div>
      </aside>
    </div>
    <section class="inspector" id="inspector" aria-live="polite"></section>
    <div class="utility"><button class="btn secondary" id="exportBtn">⬇ 匯出目前進度 CSV</button><button class="btn secondary" id="resetBtn">↺ 重設本機進度</button></div>
  </section>

  <section id="noticeView" class="notice-view"></section>
  <footer class="footer">進度儲存在目前瀏覽器，不會自動寫回 Google Sheet。表格主清單基準：2026-09-02。</footer>
</main>
<script>
const ITEMS=[
['核心裝備','35–40L 徒步背包','腰帶、胸帶合身；裝滿後試背',1,'需採買','🎒','已加入採買清單'],['核心裝備','主走鞋','低筒越野跑鞋／輕健行鞋；下午試穿',1,'需採買','🥾',''],['核心裝備','休息鞋','拖鞋或涼鞋；洗澡、讓腳透氣',1,'需採買','🩴',''],['核心裝備','登山杖','一對；附杖尖保護套',1,'待確認','🥢',''],
['防雨','防水透氣雨衣','有帽、可調帽緣；不是普通防風外套',1,'需採買','🧥',''],['防雨','輕量雨褲','雨天與強風使用',1,'待確認','👖',''],['防雨','背包雨套','尺寸符合背包',1,'已有','🌧️','背包若已附可免買'],['防雨','背包內防水袋','睡袋與乾衣最內層保護',1,'待確認','🛍️',''],['防雨','防水收納袋','衣物、盥洗、電子各一',3,'待確認','🧺',''],
['衣物','快乾短袖','輪替穿著',2,'需採買','👕',''],['衣物','快乾長袖','防曬、冷早晨',1,'需採買','👚',''],['衣物','薄刷毛中層','晚間與十月保暖',1,'需採買','🧶',''],['衣物','輕保暖外套','化纖或羽絨；可壓縮',1,'需採買','🧥',''],['衣物','徒步短褲','快乾',1,'需採買','🩳','兩截褲可兼用'],['衣物','薄長褲','快乾；晚間／較冷日',1,'需採買','👖',''],['衣物','內褲','輪替',3,'需採買','🩲','目前採買表為 2 件，建議再確認'],['衣物','徒步襪','羊毛或合成纖維；無厚縫',3,'需採買','🧦',''],['衣物','睡衣','可兼備用保暖層',1,'需採買','🥋',''],['衣物','帽子／Buff／薄手套','日曬、風雨、冷早晨',1,'需採買','🧢','影片有帽子與 Buff，薄手套需另確認'],
['睡眠','三季睡袋','舒適溫度約 8–12°C',1,'需採買','🌯',''],['睡眠','睡袋內襯','衛生、增加保暖',1,'需採買','🛏️',''],['睡眠','耳塞','庇護所必備',5,'待確認','🎧','藥局另購'],['睡眠','眼罩','庇護所必備',1,'需採買','😴',''],['睡眠','頭燈','記得一起放入充電線',1,'待確認','🔦',''],
['盥洗／洗衣','牙刷、牙膏、刮鬍刀','選旅行裝，集中放一袋',1,'待確認','🪥',''],['盥洗／洗衣','洗髮／沐浴用品','旅行裝或固體用品',1,'待確認','🧼',''],['盥洗／洗衣','防曬、護唇膏','高係數防曬',1,'待確認','🧴',''],['盥洗／洗衣','衛生紙、濕紙巾','小包補充',1,'待確認','🧻',''],['盥洗／洗衣','洗衣片／洗衣皂','手洗衣物',1,'待確認','🫧',''],['盥洗／洗衣','曬衣繩＋衣夾','衣夾 4–6 個',1,'待確認','🧷',''],
['腳部／醫藥','水泡貼','至少 6–10 片',1,'待確認','🩹',''],['腳部／醫藥','強黏膠帶','有摩擦熱點立刻貼',1,'待確認','🧵',''],['腳部／醫藥','防磨膏／凡士林','每天預防摩擦',1,'待確認','🫙',''],['腳部／醫藥','OK 繃、紗布、消毒用品、鑷子','小型急救包',1,'待確認','⛑️',''],['腳部／醫藥','個人處方藥、腸胃藥、止痛藥','原包裝；依醫囑',1,'待確認','💊',''],['腳部／醫藥','指甲剪','避免指甲壓傷',1,'待確認','✂️',''],
['電子／文件','手機、充電器、短線','出發前測試充電組合',1,'待確認','📱',''],['電子／文件','行動電源','10,000mAh',1,'待確認','🔋',''],['電子／文件','歐規轉接頭','確認為 Type C／E／F 相容',1,'待確認','🔌',''],['電子／文件','防水手機袋','雨天仍可取用導航',1,'待確認','📲',''],['電子／文件','護照、保險、信用卡、現金','信用卡至少兩張，分開放',1,'待確認','🛂',''],['電子／文件','朝聖者護照 Credencial','住宿與蓋章會使用',1,'待確認','📕',''],['電子／文件','離線地圖、訂房 App','出發前先下載並登入',1,'待確認','🗺️','']
].map((x,i)=>({id:i+1,category:x[0],name:x[1],tip:x[2],qty:x[3],sheetStatus:x[4],icon:x[5],note:x[6]}));
const NOTICE_GROUPS=[
{title:'文件與金流',icon:'🛂',rows:[['護照效期與姓名','效期、機票姓名、保險資料互相一致'],['備份重要文件','護照、保險、機票存手機離線檔並另存雲端'],['信用卡與現金分開放','至少兩張卡，不要放在同一個位置']]},
{title:'裝備實測',icon:'🥾',rows:[['主走鞋先磨合','不要帶全新鞋直接走長距離'],['背包負重試走','把預計裝備放入，至少走一次 8–10 公里'],['防雨系統測試','雨衣、雨套、防水袋要能快速取用'],['所有充電線試充','手機、行動電源、頭燈逐一確認']]},
{title:'打包原則',icon:'🎒',rows:[['總重量再秤一次','步行背包以體重約 10% 為參考，依個人狀況調整'],['乾衣與睡袋雙層防水','雨套不是唯一防線，內部仍需防水袋'],['每日用品放上層','雨衣、水、護照、急救不要壓在最底下']]},
{title:'旅拍與資料',icon:'📷',rows:[['記憶卡清空並格式化','先確認素材已完成雙備份'],['設定每日備份流程','至少保留原卡＋另一份備份'],['準備拍攝清單','出發、行走、抵達、住宿、補給各留一組鏡頭']]}
];
const KEY='camino-inventory-v1';const NOTICE_KEY='camino-notices-v1';
let saved=JSON.parse(localStorage.getItem(KEY)||'{}');let selected=1;let category='全部';
const state=id=>saved[id]||{ready:ITEMS[id-1].sheetStatus==='已有',packed:false};
function save(){localStorage.setItem(KEY,JSON.stringify(saved));render()}
function setState(id,patch){saved[id]={...state(id),...patch};save()}
function statusOf(item){return state(item.id).ready?'已有':item.sheetStatus}
function statusClass(s){return s==='已有'?'ready':s==='需採買'?'buy':'check'}
function filtered(){const q=document.querySelector('#search').value.trim().toLowerCase();const f=document.querySelector('#statusFilter').value;return ITEMS.filter(i=>!state(i.id).packed&&(category==='全部'||i.category===category)&&(!q||[i.name,i.tip,i.note,i.category].join(' ').toLowerCase().includes(q))&&(f==='all'||(f==='ready'&&state(i.id).ready)||(f==='unready'&&!state(i.id).ready)||f===statusOf(i)))}
function render(){
 const ready=ITEMS.filter(i=>state(i.id).ready),packed=ITEMS.filter(i=>state(i.id).packed),units=ITEMS.reduce((n,i)=>n+i.qty,0),packedUnits=packed.reduce((n,i)=>n+i.qty,0);
 document.querySelector('#typeCount').textContent=ITEMS.length;document.querySelector('#unitCount').textContent=units;document.querySelector('#readyCount').textContent=ready.length;
 const rp=Math.round(ready.length/ITEMS.length*100),pp=Math.round(packedUnits/units*100);document.querySelector('#readyPct').textContent=`${rp}%`;document.querySelector('#packedPct').textContent=`${pp}%`;document.querySelector('#readyBar').style.width=rp+'%';document.querySelector('#packedBar').style.width=pp+'%';
 const list=filtered();document.querySelector('#leftCount').textContent=list.length;document.querySelector('#itemList').innerHTML=list.length?list.map(i=>`<button class="card ${selected===i.id?'selected':''}" draggable="true" data-id="${i.id}" aria-label="${i.name}，數量 ${i.qty}，${statusOf(i)}"><span class="icon" aria-hidden="true">${i.icon}</span><span class="card-main"><span class="card-name">${i.name}</span><span class="meta"><span>${i.category}</span><span class="state ${statusClass(statusOf(i))}">${statusOf(i)}</span></span></span><span><span class="qty">${i.qty}</span><input class="ready-check" type="checkbox" ${state(i.id).ready?'checked':''} aria-label="已準備 ${i.name}" data-ready="${i.id}"></span></button>`).join(''):'<div class="empty">這個篩選條件下沒有待整理裝備。</div>';
 document.querySelector('#packCount').textContent=`${packedUnits} / ${units}`;document.querySelector('#slotSummary').textContent=`${packed.length} / ${ITEMS.length} 格`;
 const slotItems=[...packed,...Array(Math.max(12-packed.length,0)).fill(null)].slice(0,Math.max(12,packed.length));document.querySelector('#slots').innerHTML=slotItems.map(i=>i?`<button class="slot filled" data-id="${i.id}" title="${i.name}"><span><span class="icon">${i.icon}</span><span class="slot-name">${i.name}</span></span><span class="qty">${i.qty}</span></button>`:'<div class="slot" aria-hidden="true"></div>').join('');
 renderInspector();bindDynamic();
}
function renderInspector(){const i=ITEMS.find(x=>x.id===selected)||ITEMS[0],s=state(i.id);document.querySelector('#inspector').innerHTML=`<div class="icon" aria-hidden="true">${i.icon}</div><div class="detail"><h3>${i.name} <span class="state ${statusClass(statusOf(i))}">${statusOf(i)}</span></h3><p>${i.tip||'出發前再檢查一次。'}</p><small>${i.category}・數量 ${i.qty}${i.note?'・'+i.note:''}</small></div><div class="actions"><button class="btn ${s.packed?'danger':'primary'}" id="packBtn">${s.packed?'取出行李':'放入行李'}</button><button class="btn secondary" id="readyBtn">${s.ready?'標記未完成':'標記已準備'}</button></div>`;document.querySelector('#packBtn').onclick=()=>setState(i.id,{packed:!s.packed,ready:s.packed?s.ready:true});document.querySelector('#readyBtn').onclick=()=>setState(i.id,{ready:!s.ready,packed:s.ready?false:s.packed})}
function bindDynamic(){document.querySelectorAll('.card').forEach(el=>{el.onclick=e=>{if(e.target.matches('[data-ready]'))return;selected=+el.dataset.id;render()};el.ondragstart=e=>e.dataTransfer.setData('text/plain',el.dataset.id)});document.querySelectorAll('[data-ready]').forEach(el=>el.onclick=e=>{e.stopPropagation();setState(+el.dataset.ready,{ready:el.checked,packed:el.checked?state(+el.dataset.ready).packed:false})});document.querySelectorAll('.slot.filled').forEach(el=>el.onclick=()=>{selected=+el.dataset.id;render()})}
function renderChips(){const cats=['全部',...new Set(ITEMS.map(i=>i.category))];document.querySelector('#chips').innerHTML=cats.map(c=>`<button class="chip ${c===category?'active':''}" data-cat="${c}">${c}</button>`).join('');document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{category=b.dataset.cat;renderChips();render()})}
function renderNotices(){const done=JSON.parse(localStorage.getItem(NOTICE_KEY)||'{}');document.querySelector('#noticeView').innerHTML=NOTICE_GROUPS.map((g,gi)=>`<article class="notice-card"><h2>${g.icon} ${g.title}</h2>${g.rows.map((r,ri)=>{const id=`${gi}-${ri}`;return `<label class="notice-row"><input type="checkbox" data-notice="${id}" ${done[id]?'checked':''}><span><b>${r[0]}</b><small>${r[1]}</small></span></label>`}).join('')}</article>`).join('');document.querySelectorAll('[data-notice]').forEach(c=>c.onchange=()=>{done[c.dataset.notice]=c.checked;localStorage.setItem(NOTICE_KEY,JSON.stringify(done))})}
document.querySelector('#search').oninput=render;document.querySelector('#statusFilter').onchange=render;
document.querySelector('#packDrop').ondragover=e=>{e.preventDefault()};document.querySelector('#packDrop').ondrop=e=>{e.preventDefault();const id=+e.dataTransfer.getData('text/plain');if(id)setState(id,{ready:true,packed:true})};
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===t));const gear=t.dataset.view==='gear';document.querySelector('#gearView').classList.toggle('hidden',!gear);document.querySelector('#noticeView').classList.toggle('active',!gear)});
document.querySelector('#resetBtn').onclick=()=>{if(confirm('要清除這台裝置上的所有準備與裝包進度嗎？')){localStorage.removeItem(KEY);saved={};render()}};
document.querySelector('#exportBtn').onclick=()=>{const rows=[['類別','項目','數量','準備狀態','已放入包','新手提醒','備註'],...ITEMS.map(i=>[i.category,i.name,i.qty,state(i.id).ready?'已有':i.sheetStatus,state(i.id).packed?'TRUE':'FALSE',i.tip,i.note])];const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='Camino-打包進度.csv';a.click();URL.revokeObjectURL(a.href)};
renderChips();renderNotices();render();
</script>
</body>
</html>
