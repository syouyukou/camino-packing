const NOTICE_GROUPS=[
{title:'文件與金流',icon:'🛂',rows:[['護照效期與姓名','效期、機票姓名、保險資料互相一致'],['備份重要文件','護照、保險、機票存手機離線檔並另存雲端'],['信用卡與現金分開放','至少兩張卡，不要放在同一個位置']]},
{title:'裝備實測',icon:'🥾',rows:[['主走鞋先磨合','不要帶全新鞋直接走長距離'],['背包負重試走','把預計裝備放入，至少走一次 8–10 公里'],['防雨系統測試','雨衣、雨套、防水袋要能快速取用'],['所有充電線試充','手機、行動電源、頭燈逐一確認']]},
{title:'打包原則',icon:'🎒',rows:[['總重量再秤一次','步行背包以體重約 10% 為參考，依個人狀況調整'],['乾衣與睡袋雙層防水','雨套不是唯一防線，內部仍需防水袋'],['每日用品放上層','雨衣、水、護照、急救不要壓在最底下']]},
{title:'旅拍與資料',icon:'📷',rows:[['記憶卡清空並格式化','先確認素材已完成雙備份'],['設定每日備份流程','至少保留原卡＋另一份備份'],['準備拍攝清單','出發、行走、抵達、住宿、補給各留一組鏡頭']]}
];
const KEY='camino-inventory-v1';const NOTICE_KEY='camino-notices-v1';const VERSION_KEY='camino-data-version';const DATA_VERSION='2026-09-13';
const baselineState=item=>({ready:item?.sheetStatus==='已有',packed:false,excluded:item?.sheetStatus==='不攜帶'});
let saved=JSON.parse(localStorage.getItem(KEY)||'{}');let selected=1;let category='全部';
if(localStorage.getItem(VERSION_KEY)!==DATA_VERSION){ITEMS.forEach(item=>{const previous=saved[item.id];if(previous?.packed){saved[item.id]={...previous,ready:true,statusOverride:'已有'};return}if(previous?.excluded&&item.sheetStatus!=='不攜帶')return;const excluded=item.sheetStatus==='不攜帶';saved[item.id]={...previous,...baselineState(item),statusOverride:excluded?undefined:item.sheetStatus}});localStorage.setItem(KEY,JSON.stringify(saved));localStorage.setItem(VERSION_KEY,DATA_VERSION)}
const state=id=>saved[id]||baselineState(ITEMS.find(x=>x.id===id));
function save(){localStorage.setItem(KEY,JSON.stringify(saved));render()}
function setState(id,patch){saved[id]={...state(id),...patch};save()}
function statusOf(item){const s=state(item.id);return s.excluded?'不帶':s.statusOverride||(s.ready?'已有':item.sheetStatus)}
function statusClass(s){return s==='不帶'?'skip':s==='已有'?'ready':s==='需採買'?'buy':'check'}
function statusControl(i){const current=statusOf(i);if(current==='不帶')return `<span class="state skip">不帶</span>`;return `<select class="state state-select ${statusClass(current)}" data-status="${i.id}" aria-label="變更 ${i.name} 的準備狀態"><option value="需採買" ${current==='需採買'?'selected':''}>需採買</option><option value="待確認" ${current==='待確認'?'selected':''}>待確認</option><option value="已有" ${current==='已有'?'selected':''}>已有</option></select>`}
function filtered(){const q=document.querySelector('#search').value.trim().toLowerCase();const f=document.querySelector('#statusFilter').value;return ITEMS.filter(i=>{const s=state(i.id),matches=(category==='全部'||i.category===category)&&(!q||[i.name,i.tip,i.note,i.category].join(' ').toLowerCase().includes(q));if(!matches)return false;if(f==='excluded')return !!s.excluded;return !s.excluded&&!s.packed&&(f==='all'||(f==='ready'&&s.ready)||(f==='unready'&&!s.ready)||f===statusOf(i))})}
function render(){
 const active=ITEMS.filter(i=>!state(i.id).excluded),excluded=ITEMS.filter(i=>state(i.id).excluded),ready=active.filter(i=>state(i.id).ready),packed=active.filter(i=>state(i.id).packed),units=active.reduce((n,i)=>n+i.qty,0),packedUnits=packed.reduce((n,i)=>n+i.qty,0);
 document.querySelector('#typeCount').textContent=active.length;document.querySelector('#unitCount').textContent=units;document.querySelector('#readyCount').textContent=ready.length;document.querySelector('option[value="excluded"]').textContent=`🚫 不帶清單（${excluded.length}）`;
 const rp=active.length?Math.round(ready.length/active.length*100):0,pp=units?Math.round(packedUnits/units*100):0;document.querySelector('#readyPct').textContent=`${rp}%`;document.querySelector('#packedPct').textContent=`${pp}%`;document.querySelector('#readyBar').style.width=rp+'%';document.querySelector('#packedBar').style.width=pp+'%';
 const list=filtered();document.querySelector('#leftCount').textContent=list.length;document.querySelector('#itemList').innerHTML=list.length?list.map(i=>`<article class="card ${selected===i.id?'selected':''}" tabindex="0" role="button" draggable="true" data-id="${i.id}" aria-label="${i.name}，數量 ${i.qty}，${statusOf(i)}"><span class="icon" aria-hidden="true">${i.icon}</span><span class="card-main"><span class="card-name">${i.name}</span><span class="meta"><span>${i.category}</span>${statusControl(i)}</span></span><span><span class="qty">${i.qty}</span><input class="ready-check" type="checkbox" ${state(i.id).ready?'checked':''} aria-label="已準備 ${i.name}" data-ready="${i.id}"></span></article>`).join(''):'<div class="empty">這個篩選條件下沒有待整理裝備。</div>';
 document.querySelector('#packCount').textContent=`${packedUnits} / ${units}`;document.querySelector('#slotSummary').textContent=`${packed.length} / ${active.length} 格`;
 const slotItems=[...packed,...Array(Math.max(12-packed.length,0)).fill(null)].slice(0,Math.max(12,packed.length));document.querySelector('#slots').innerHTML=slotItems.map(i=>i?`<button class="slot filled" data-id="${i.id}" title="${i.name}"><span><span class="icon">${i.icon}</span><span class="slot-name">${i.name}</span></span><span class="qty">${i.qty}</span></button>`:'<div class="slot" aria-hidden="true"></div>').join('');
 renderInspector();bindDynamic();
}
function renderInspector(){const i=ITEMS.find(x=>x.id===selected)||ITEMS[0],s=state(i.id);const controls=s.excluded?`<button class="btn primary" id="restoreBtn">恢復到清單</button>`:`<button class="btn ${s.packed?'danger':'primary'}" id="packBtn">${s.packed?'取出行李':'放入行李'}</button><button class="btn secondary" id="readyBtn">${s.ready?'標記未完成':'標記已準備'}</button><button class="btn danger" id="excludeBtn">這次不帶</button>`;document.querySelector('#inspector').innerHTML=`<div class="icon" aria-hidden="true">${i.icon}</div><div class="detail"><h3>${i.name} <span class="state ${statusClass(statusOf(i))}">${statusOf(i)}</span></h3><p>${i.tip||'出發前再檢查一次。'}</p><small>${i.category}・數量 ${i.qty}${i.note?'・'+i.note:''}</small></div><div class="actions">${controls}</div>`;if(s.excluded){document.querySelector('#restoreBtn').onclick=()=>setState(i.id,{excluded:false})}else{document.querySelector('#packBtn').onclick=()=>setState(i.id,{packed:!s.packed,ready:s.packed?s.ready:true,statusOverride:s.packed?s.statusOverride:'已有'});document.querySelector('#readyBtn').onclick=()=>setState(i.id,{ready:!s.ready,packed:s.ready?false:s.packed,statusOverride:s.ready?i.sheetStatus:'已有'});document.querySelector('#excludeBtn').onclick=()=>setState(i.id,{excluded:true,packed:false})}}
function bindDynamic(){document.querySelectorAll('.card').forEach(el=>{const open=e=>{if(e.target.matches('[data-ready],[data-status]'))return;selected=+el.dataset.id;render()};el.onclick=open;el.onkeydown=e=>{if((e.key==='Enter'||e.key===' ')&&!e.target.matches('[data-ready],[data-status]')){e.preventDefault();open(e)}};el.ondragstart=e=>e.dataTransfer.setData('text/plain',el.dataset.id)});document.querySelectorAll('[data-ready]').forEach(el=>el.onclick=e=>{e.stopPropagation();const i=ITEMS.find(x=>x.id===+el.dataset.ready);setState(i.id,{ready:el.checked,packed:el.checked?state(i.id).packed:false,statusOverride:el.checked?'已有':i.sheetStatus})});document.querySelectorAll('[data-status]').forEach(el=>el.onchange=e=>{e.stopPropagation();const id=+el.dataset.status,value=el.value;setState(id,{statusOverride:value,ready:value==='已有',packed:value==='已有'?state(id).packed:false})});document.querySelectorAll('.slot.filled').forEach(el=>el.onclick=()=>{selected=+el.dataset.id;render()})}
function renderChips(){const cats=['全部',...new Set(ITEMS.map(i=>i.category))];document.querySelector('#chips').innerHTML=cats.map(c=>`<button class="chip ${c===category?'active':''}" data-cat="${c}">${c}</button>`).join('');document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{category=b.dataset.cat;renderChips();render()})}
function renderNotices(){const done=JSON.parse(localStorage.getItem(NOTICE_KEY)||'{}');document.querySelector('#noticeView').innerHTML=NOTICE_GROUPS.map((g,gi)=>`<article class="notice-card"><h2>${g.icon} ${g.title}</h2>${g.rows.map((r,ri)=>{const id=`${gi}-${ri}`;return `<label class="notice-row"><input type="checkbox" data-notice="${id}" ${done[id]?'checked':''}><span><b>${r[0]}</b><small>${r[1]}</small></span></label>`}).join('')}</article>`).join('');document.querySelectorAll('[data-notice]').forEach(c=>c.onchange=()=>{done[c.dataset.notice]=c.checked;localStorage.setItem(NOTICE_KEY,JSON.stringify(done))})}
document.querySelector('#search').oninput=render;document.querySelector('#statusFilter').onchange=render;
document.querySelector('#packDrop').ondragover=e=>{e.preventDefault()};document.querySelector('#packDrop').ondrop=e=>{e.preventDefault();const id=+e.dataTransfer.getData('text/plain');if(id)setState(id,{ready:true,packed:true,statusOverride:'已有'})};
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===t));const gear=t.dataset.view==='gear';document.querySelector('#gearView').classList.toggle('hidden',!gear);document.querySelector('#noticeView').classList.toggle('active',!gear)});
document.querySelector('#resetBtn').onclick=()=>{if(confirm('要清除這台裝置上的所有準備與裝包進度嗎？')){localStorage.removeItem(KEY);saved={};render()}};
document.querySelector('#exportBtn').onclick=()=>{const rows=[['類別','項目','數量','是否攜帶','準備狀態','已放入包','新手提醒','備註'],...ITEMS.map(i=>[i.category,i.name,i.qty,state(i.id).excluded?'不帶':'攜帶',statusOf(i),state(i.id).packed?'TRUE':'FALSE',i.tip,i.note])];const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='Camino-打包進度.csv';a.click();URL.revokeObjectURL(a.href)};
renderChips();renderNotices();render();
</script>
